<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Verse</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--txt:#14181F;--line:#14181F;--surf:#F4F5F6;--blue:#14181F;--mint:#E1E3E6;--lemon:#EDEEF0;--coral:#C9CDD3;--lilac:#D3D6DB;--ink:#14181F;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:1180px;margin:0 auto;padding:16px}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;grid-auto-flow:dense}
.t{border:2px solid var(--line);border-radius:26px;padding:22px;position:relative;overflow:hidden;background:var(--surf);color:var(--ink)}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s12{grid-column:span 12}
.r2{grid-row:span 2}
.hero{background:var(--ink);color:#F1F2F4;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;border-color:var(--line)}
h1{font-size:clamp(3rem,10vw,6.6rem);line-height:.9;margin:0 0 12px;font-weight:800;letter-spacing:-.04em}
.hero p{margin:0;max-width:30ch;font-size:1.1rem;opacity:.85}
.mock{position:absolute;right:26px;top:22px;width:74px;height:136px;border-radius:18px;background:var(--lemon);border:3px solid #14181F;animation:enter .9s cubic-bezier(.2,1.4,.4,1) both,float 4s ease-in-out .9s infinite}
.mock::before{content:"";position:absolute;top:10px;left:10px;width:22px;height:22px;border-radius:7px;background:#14181F}
.mock::after{content:"";position:absolute;top:16px;left:40px;width:9px;height:9px;border-radius:50%;background:#14181F}
@keyframes enter{from{transform:translateY(60px) rotate(-30deg);opacity:0}to{transform:rotate(8deg);opacity:1}}
@keyframes float{0%,100%{transform:rotate(8deg) translateY(0)}50%{transform:rotate(5deg) translateY(-8px)}}
.search{background:var(--blue);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:12px}
.search label{font-weight:600;font-size:1.15rem}
.field{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #14181F;border-radius:16px;padding:0 14px;transition:transform .15s,box-shadow .15s}
.field:focus-within{transform:translate(-2px,-2px);box-shadow:4px 4px 0 #14181F}
.field input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:1.05rem;padding:14px 0;color:#14181F}
.field svg{width:20px;height:20px;flex:none;stroke:#14181F}
.num{font-size:clamp(2.4rem,6vw,3.6rem);font-weight:800;line-height:1;letter-spacing:-.03em;display:block}
.lbl{font-size:.95rem;font-weight:600}
.coral{background:var(--coral)}.mint{background:var(--mint)}.lemon{background:var(--lemon)}.lilac{background:var(--lilac)}
.marq{padding:12px 0;background:var(--lemon);border-radius:999px}
.track{display:flex;width:max-content;animation:slide 28s linear infinite}
.track span{padding:0 22px;font-weight:800;font-size:1.3rem;white-space:nowrap}
.track span::after{content:"●";margin-left:44px;font-size:.6rem;vertical-align:middle}
@keyframes slide{to{transform:translateX(-50%)}}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.grp{display:flex;flex-wrap:wrap;gap:8px}
.btn,.chip,.fav,.x{position:relative;overflow:hidden;font:inherit;font-weight:600;cursor:pointer;color:#14181F;background:#fff;border:2px solid #14181F;border-radius:999px;padding:9px 18px;box-shadow:3px 3px 0 #14181F;transition:transform .12s,box-shadow .12s,background .2s}
.btn:hover,.chip:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #14181F}
.btn:active,.chip:active,.fav:active,.x:active{transform:translate(3px,3px) scale(.97);box-shadow:0 0 0 #14181F}
.chip[aria-pressed="true"]{background:#14181F;color:#fff}
.btn:focus-visible,.chip:focus-visible,.fav:focus-visible,.x:focus-visible{outline:3px solid #6B717B;outline-offset:3px}
.rip{position:absolute;border-radius:50%;background:#14181F;opacity:.25;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.sub{margin:0;font-weight:600}
.card{display:flex;flex-direction:column;gap:12px;min-height:290px;animation:pop .5s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i)*45ms);transition:transform .25s}
.card:hover{transform:translateY(-5px)}
.pic{height:190px;display:grid;place-items:center;background:rgba(255,255,255,.75);border:2px solid #14181F;border-radius:18px}.card.Flagship .pic{height:230px}.pic svg{height:86%;width:auto;transition:transform .35s cubic-bezier(.2,1.4,.4,1);filter:drop-shadow(4px 5px 0 rgba(20,24,31,.18))}.card:hover .pic svg{transform:rotate(-5deg) scale(1.06)}.modal .pic{height:220px;margin:14px 0}
.card.Flagship{background:var(--lilac)}.card.Menengah{background:var(--mint)}.card.Hemat{background:var(--lemon)}
@keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.top{display:flex;justify-content:space-between;align-items:center}
.tag{background:#14181F;color:#fff;border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600}
.fav{width:42px;height:42px;padding:0;font-size:1.1rem;display:grid;place-items:center;box-shadow:2px 2px 0 #14181F}
.fav.on{background:#14181F;color:#fff}
.fav.pop{animation:heart .45s}
@keyframes heart{30%{transform:scale(1.5) rotate(-12deg)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.card h3{margin:0;font-size:clamp(1.5rem,3vw,2rem);line-height:1.05;letter-spacing:-.02em;max-width:14ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.chips li{border:2px solid #14181F;border-radius:999px;padding:3px 11px;font-size:.88rem;background:rgba(255,255,255,.55)}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}
.price{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.price small{display:block;font-size:.8rem;font-weight:600;opacity:.75}
.empty{text-align:center;padding:50px 20px}
.empty b{font-size:1.6rem;display:block;margin-bottom:6px}
.note{text-align:center;font-size:.9rem;opacity:.75;padding:26px 10px 10px}
.ov{position:fixed;inset:0;background:rgba(20,24,31,.72);display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.ov.open{opacity:1;pointer-events:auto}
.modal{width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;transform:translateY(40px) scale(.92);transition:transform .35s cubic-bezier(.2,1.4,.4,1);border:2px solid #14181F;border-radius:28px;padding:24px;color:#14181F}
.ov.open .modal{transform:none}
.modal h2{font-size:2rem;margin:8px 0 2px;line-height:1;letter-spacing:-.03em}
.x{position:absolute;right:16px;top:16px;width:42px;height:42px;padding:0;font-size:1.1rem;box-shadow:2px 2px 0 #14181F}
.spec{margin:16px 0;display:grid;gap:8px}
.spec div{display:flex;justify-content:space-between;gap:16px;background:rgba(255,255,255,.6);border:2px solid #14181F;border-radius:14px;padding:10px 14px}
.spec dt{font-weight:600}.spec dd{margin:0;text-align:right}
.mf{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:#14181F;color:#fff;border:2px solid #fff;border-radius:999px;padding:10px 20px;font-weight:600;transition:transform .35s cubic-bezier(.2,1.4,.4,1);z-index:30}
.toast.show{transform:translate(-50%,0)}
@media (max-width:900px){.bento{grid-template-columns:repeat(6,1fr)}.s7,.s5,.s12,.s6{grid-column:span 6}.s4,.s3,.s2{grid-column:span 3}.r2{grid-row:auto}.hero{min-height:260px}}
@media (max-width:560px){.bento{grid-template-columns:repeat(2,1fr)}.s7,.s5,.s12,.s6{grid-column:span 2}.s4,.s3,.s2{grid-column:span 2}.st{grid-column:span 1!important}.t{padding:18px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* glass */
:root{--bg:#E9EBEE;--glass:rgba(255,255,255,.5);--edge:rgba(255,255,255,.8)}

.bg i:nth-child(1){width:min(420px,80vw);top:-110px;left:-90px;background:#14181F}

.mock{background:rgba(255,255,255,.3);border:1.5px solid rgba(255,255,255,.75);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.field{background:rgba(255,255,255,.72);border:1px solid var(--edge);box-shadow:0 2px 10px rgba(20,24,31,.08)}

.btn:hover,.chip:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(20,24,31,.16)}
.btn:active,.chip:active,.fav:active,.x:active{transform:scale(.92);box-shadow:0 1px 4px rgba(20,24,31,.12)}
.chip[aria-pressed="true"],.fav.on,.card .btn{background:#14181F;color:#fff;border-color:#14181F}
.chip[aria-pressed="true"] .rip,.card .btn .rip{background:#fff}
.chips li{border:1px solid rgba(20,24,31,.12);background:rgba(255,255,255,.6)}
.pic{background:rgba(255,255,255,.5);border:1px solid var(--edge);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.pic svg{filter:drop-shadow(0 14px 14px rgba(20,24,31,.25))}
.ov{background:rgba(233,235,238,.5);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.t.modal{background:rgba(255,255,255,.72);border-radius:34px;box-shadow:0 30px 70px rgba(20,24,31,.2),inset 0 1px 0 rgba(255,255,255,.9)}
.spec div{background:rgba(255,255,255,.6);border:1px solid rgba(20,24,31,.1)}
.toast{background:rgba(20,24,31,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.25)}
.pic img{height:90%;width:auto;max-width:90%;object-fit:contain;transition:transform .35s cubic-bezier(.2,1.4,.4,1);filter:drop-shadow(0 14px 14px rgba(20,24,31,.25))}.card:hover .pic img{transform:rotate(-5deg) scale(1.06)}
.pic img{height:157px;width:auto;max-width:none}.card.Flagship .pic img{height:190px}.modal .pic img{height:182px}
.boot{position:fixed;inset:0;z-index:100;background:#0B0D10;display:grid;place-items:center;animation:bootOut .7s cubic-bezier(.7,0,.2,1) 4.35s forwards}
@keyframes bootOut{0%{clip-path:circle(150% at 50% 50%);opacity:1}80%{opacity:1}100%{clip-path:circle(0% at 50% 50%);opacity:0}}
.vs{position:relative;overflow:hidden;container-type:size;width:min(100vw,calc(100vh*.5625));width:min(100vw,calc(100dvh*.5625));height:100vh;height:100dvh;background:#E9EBEE;color:#14181F;animation:vsOut .85s cubic-bezier(.6,0,.9,.5) 4.2s forwards}
@keyframes vsOut{to{transform:scale(1.12)}}
.vs .vc{position:absolute;aspect-ratio:1;border-radius:50%;transform:scale(0);animation:vcIn .9s cubic-bezier(.2,1.3,.4,1) forwards,vcDrift 4s ease-in-out infinite alternate}
@keyframes vcIn{to{transform:scale(1)}}

.vs .vc1{width:90cqw;left:-30cqw;top:-12cqh;background:#14181F}
.vs .vc2{width:60cqw;right:-22cqw;top:38cqh;background:#8E949D;animation-delay:.15s,.15s}
.vs .vc3{width:80cqw;left:10cqw;bottom:-26cqh;background:#C2C6CC;animation-delay:.3s,.3s}
.vs .vglass{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.85);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1cqh 3cqh rgba(20,24,31,.12),inset 0 1px 0 rgba(255,255,255,.9)}
.vs .vcard{position:absolute;left:14cqw;top:18cqh;width:72cqw;height:46cqh;border-radius:9cqw;background:rgba(255,255,255,.38);opacity:0;transform:translateY(10cqh) rotate(-8deg) scale(.88);animation:vcardIn .9s cubic-bezier(.2,1.2,.3,1) .4s forwards}
@keyframes vcardIn{to{opacity:1;transform:rotate(-3deg)}}
.vs .vph{position:absolute;width:32cqw;left:34cqw;top:24cqh;opacity:0;transform:translateY(40cqh) rotate(10deg);filter:drop-shadow(0 2cqh 2cqh rgba(20,24,31,.28));animation:vPh .9s cubic-bezier(.2,1.25,.3,1) .6s forwards,vFloat 3s ease-in-out 1.6s infinite alternate}

@keyframes vFloat{to{translate:0 -1.6cqh}}

@keyframes vPop{to{transform:scale(1)}}
.vs .shine{transform:translateX(-30px) skewX(-18deg);animation:vShine 1.4s ease-in-out 1.8s 2}

.vs .vring{position:absolute;width:70cqw;left:15cqw;top:calc(24cqh - 3cqw);overflow:visible}
.vs .rd{fill:none;stroke:#14181F;stroke-width:.5;stroke-dasharray:1;stroke-dashoffset:1;animation:vDraw 1.1s ease 1s forwards}
@keyframes vDraw{to{stroke-dashoffset:0}}
.vs .rs{fill:none;stroke:#14181F;stroke-opacity:.4;stroke-width:.4;stroke-dasharray:1.5 3}
.vs .spin{transform-origin:50px 50px;opacity:0;animation:vSpin 7s linear infinite,vShow .5s ease 1.8s forwards}

.vs .vpill.k{background:#14181F;color:#fff;border-color:#14181F}
@keyframes vpIn{from{opacity:0;transform:translate(var(--fx),var(--fy)) scale(.5);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

.vs .vwm{position:absolute;left:0;right:0;top:68cqh;text-align:center;font-size:19cqw;font-weight:800;letter-spacing:-.045em;line-height:1.1;overflow:hidden;padding-bottom:.5cqw}

const img=p=>PHOTO[p.id]?`<img src="${PHOTO[p.id]}" alt="${p.b} ${p.n}">`:`<svg viewBox="0 0 100 200" role="img" aria-label="Ilustrasi ${p.b} ${p.n}"><rect x="90" y="56" width="5" height="26" rx="2" fill="#14181F"/><rect x="90" y="92" width="5" height="14" rx="2" fill="#14181F"/><rect x="6" y="4" width="86" height="192" rx="17" fill="${BODY[p.id]}" stroke="#14181F" stroke-width="3"/>${CM[CAM[p.id]]}</svg>`;
const $=s=>document.querySelector(s);
const rp=v=>"Rp "+v.toLocaleString("id-ID");
const S={q:"",cat:"Semua",sort:"Termurah",fav:new Set(),cmp:[]};
const CATS=["Semua","Flagship","Menengah","Hemat"],SORTS=["Termurah","Termahal","Nama A–Z"];
const full=p=>p.b+" "+p.n;

$("#trk").innerHTML=[...new Set(P.map(p=>p.b))].concat([...new Set(P.map(p=>p.b))]).map(b=>"<span>"+b+"</span>").join("");
$("#cats").innerHTML=CATS.map(c=>`<button class="chip" data-cat="${c}">${c}</button>`).join("");
$("#sorts").innerHTML=SORTS.map(c=>`<button class="chip" data-sort="${c}">${c}</button>`).join("");

function count(el,to){
  const from=+el.textContent||0,t0=performance.now();
  if(from===to)return;
  (function f(t){const k=Math.min(1,(t-t0)/450);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0);
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),1800)}

function render(){
  const q=S.q.trim().toLowerCase();
  let r=P.filter(p=>(S.cat==="Semua"||p.c===S.cat)&&(!q||(full(p)+" "+p.ch+" "+p.c).toLowerCase().includes(q)));
  r.sort((a,b)=>S.sort==="Termurah"?a.p-b.p:S.sort==="Termahal"?b.p-a.p:full(a).localeCompare(full(b)));
  $("#grid").innerHTML=r.length?r.map((p,i)=>`
  <article class="t card ${p.c} ${p.c==="Flagship"?"s6":"s3"}" style="--i:${i}">
    <div class="top"><span class="tag">${p.b}</span><span class="acts">${cmpBtn(p.id)}
      <button class="fav ${S.fav.has(p.id)?"on":""}" data-fav="${p.id}" aria-label="Favorit ${p.n}" aria-pressed="${S.fav.has(p.id)}">♥</button></span></div>
    <div class="pic">${img(p)}</div>
    <h3>${p.n}</h3>
    <ul class="chips"><li>${p.ch}</li><li>${p.r}/${p.m} GB</li><li>${p.bt} mAh</li></ul>
    <div class="foot"><div class="price"><small>Mulai dari</small>${rp(p.p)}</div>
      <button class="btn" data-open="${p.id}">Lihat spesifikasi</button></div>
  </article>`).join(""):`<div class="t s12 empty"><b>Tidak ada hp yang cocok</b>Coba kata kunci lain atau pilih kategori Semua.</div>`;
  count($("#cnt"),r.length);
  document.querySelectorAll("[data-cat]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cat===S.cat));
  document.querySelectorAll("[data-sort]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sort===S.sort));
}
function open(id){
  const p=P[id];
  $("#mod").className="t modal "+p.c;
  $("#mod").innerHTML=`<button class="x" data-close aria-label="Tutup">✕</button>
  <span class="tag">${p.b} · ${p.c}</span><h2 id="mt">${p.n}</h2><div class="pic">${img(p)}</div>
  <dl class="spec">
   <div><dt>Layar</dt><dd>${p.s}</dd></div><div><dt>Chipset</dt><dd>${p.ch}</dd></div>
   <div><dt>RAM</dt><dd>${p.r} GB</dd></div><div><dt>Penyimpanan</dt><dd>${p.m} GB</dd></div>
   <div><dt>Kamera belakang</dt><dd>${p.k}</dd></div><div><dt>Baterai</dt><dd>${p.bt} mAh</dd></div>
   <div><dt>Sistem operasi</dt><dd>${p.o}</dd></div></dl>
  <div class="mf"><div class="price"><small>Perkiraan harga</small>${rp(p.p)}</div>
  <button class="btn fav-m" data-fav="${p.id}">${S.fav.has(p.id)?"Hapus dari favorit":"Tambah ke favorit"}</button></div>`;
  $("#ov").classList.add("open");
  setTimeout(()=>$("#mod .x").focus(),50);
}
const close=()=>$("#ov").classList.remove("open");

document.addEventListener("pointerdown",e=>{
  const b=e.target.closest(".btn,.chip,.fav,.x");if(!b)return;
  const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,s=document.createElement("span");
  s.className="rip";s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(s);setTimeout(()=>s.remove(),600);
});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-open],[data-fav],[data-cat],[data-sort],[data-close],[data-cmp],[data-cmprm],[data-cmpclear],[data-cmpgo]");
  if(e.target===$("#ov"))return close();
  if(!t)return;
  if(t.dataset.cmp!==undefined){togCmp(+t.dataset.cmp);return}
  if(t.dataset.cmprm!==undefined){togCmp(+t.dataset.cmprm);return}
  if("cmpclear" in t.dataset){S.cmp=[];updTray();return}
  if("cmpgo" in t.dataset){openCmp();return}
  if(t.dataset.cat){S.cat=t.dataset.cat;render()}
  else if(t.dataset.sort){S.sort=t.dataset.sort;render()}
  else if(t.dataset.open){open(+t.dataset.open)}
  else if("close" in t.dataset){close()}
  else if(t.dataset.fav){
    const id=+t.dataset.fav,on=!S.fav.has(id);
    on?S.fav.add(id):S.fav.delete(id);
    document.querySelectorAll(`.fav[data-fav="${id}"]`).forEach(b=>{b.classList.toggle("on",on);b.setAttribute("aria-pressed",on);b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop")});
    const m=$(".fav-m");if(m)m.textContent=on?"Hapus dari favorit":"Tambah ke favorit";
    count($("#fcnt"),S.fav.size);toast(on?"Ditambahkan ke favorit":"Dihapus dari favorit");
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
let egFired=false,egT;
const eg=$("#egg");
function eggHTML(){
 const dots=Array.from({length:96},(_,i)=>{const c=i%8,r=(i/8)|0;return `<i style="--d:${(Math.hypot(c-3.5,r-5.5)*.08+.1).toFixed(2)}s"></i>`}).join("");
 const wm=[..."EngineOs"].map((c,i)=>`<span class="${i>5?"b":""}" style="--k:${i}">${c}</span>`).join("");
 const teeth=[0,45,90,135,180,225,270,315].map(a=>`<rect x="44" y="3" width="12" height="20" rx="3" transform="rotate(${a} 50 50)"/>`).join("");
 const pills=[["Cepat",0,"-30cqw","0cqh","left:8cqw;top:25cqh",""],["Ringan",1,"30cqw","-4cqh","right:7cqw;top:34cqh","k"],["Aman",2,"-30cqw","6cqh","left:10cqw;top:50cqh","k"],["Mulus",3,"30cqw","8cqh","right:12cqw;top:54cqh",""]]
  .map(([t,i,fx,fy,pos,k])=>`<div class="egpill egg-glass ${k}" style="--i:${i};--fx:${fx};--fy:${fy};${pos}">${t}</div>`).join("");
 return `<div class="egs"><i class="egc egc1"></i><i class="egc egc2"></i><i class="egc egc3"></i>
 <div class="egd">${dots}</div>
 <div class="egtc l egg-glass"><i></i><span>Easter egg ditemukan</span></div><div class="egtc r egg-glass"><span id="egt">00:00.0</span></div>
 <div class="egcard egg-glass"></div><div class="egwin"><i></i><i></i><i></i><span>engineos.sys</span></div>
 <div class="egpulse"></div>
 <svg class="egring" viewBox="0 0 100 100"><circle class="erd" cx="50" cy="50" r="48" pathLength="1"/></svg>
 <svg class="eggear" viewBox="0 0 100 100"><g fill="#6FB2FF">${teeth}</g><circle cx="50" cy="50" r="34" fill="#6FB2FF"/><circle cx="50" cy="50" r="21" fill="#E6F1FF"/><circle cx="50" cy="50" r="8" fill="#2F80ED"/></svg>
 ${pills}
 <div class="egwm">${wm}</div><div class="egbar"></div><div class="egtag">CEPAT · RINGAN · MULUS</div>
 <div class="egpt"><span>Memulai EngineOs</span><span id="egp">000%</span></div><div class="egpg egg-glass"><i></i></div></div>`;
}
function closeEgg(){clearTimeout(egT);eg.hidden=true;eg.innerHTML=""}
function playEgg(){
 if(matchMedia("(prefers-reduced-motion:reduce)").matches){toast("EngineOs ditemukan");return}
 clearTimeout(egT);eg.hidden=true;eg.innerHTML=eggHTML();void eg.offsetWidth;eg.hidden=false;
 const t0=performance.now(),t=$("#egt"),pc=$("#egp");
 (function f(n){if(eg.hidden)return;const e=n-t0,k=Math.min(1,Math.max(0,(e-200)/2800));
  pc.textContent=String(Math.round(k*k*(3-2*k)*100)).padStart(3,"0")+"%";t.textContent="00:0"+Math.floor(Math.min(3.5,e/1000))+"."+Math.floor((Math.min(3.5,e/1000)%1)*10);
  if(e<3500)requestAnimationFrame(f)})(t0);
 egT=setTimeout(closeEgg,3550);
}
eg.addEventListener("click",closeEgg);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!eg.hidden)closeEgg()});
$("#q").addEventListener("input",e=>{
 S.q=e.target.value;render();
 const v=S.q.toLowerCase().replace(/\s+/g,"");
 if(v==="engineos"){if(!egFired){egFired=true;playEgg()}}else egFired=false;
});
(()=>{const b=$("#boot");if(!b)return;const p=$("#bp"),tc=$("#tc"),t0=performance.now();
(function f(t){const e=t-t0;let k=Math.min(1,Math.max(0,(e-300)/3700));k=k*k*(3-2*k);p.textContent=String(Math.round(k*100)).padStart(3,"0")+"%";
const x=Math.min(5,e/1000);tc.textContent="00:0"+Math.floor(x)+"."+Math.floor((x%1)*10);if(e<5000)requestAnimationFrame(f)})(t0);
setTimeout(()=>b.remove(),5100)})();
(()=>{const h=document.querySelector("h1"),t=h.textContent;let n=0,busy=false;
h.setAttribute("role","button");h.setAttribute("tabindex","0");h.setAttribute("aria-label","E-Verse");
h.innerHTML=[...t].map((c,i)=>`<span class="l" aria-hidden="true" style="--k:${i}">${c}</span>`).join("");
const go=()=>{if(busy)return;busy=true;
h.querySelectorAll(".l").forEach(l=>{l.style.setProperty("--dx",((Math.random()*180-90)|0)+"px");l.style.setProperty("--dy",((-20-Math.random()*150)|0)+"px");l.style.setProperty("--r",((Math.random()*140-70)|0)+"deg")});
h.classList.remove("a1","a2","a3");void h.offsetWidth;h.classList.add("a"+(n++%3+1));
setTimeout(()=>{busy=false;h.classList.remove("a1","a2","a3")},1500)};
h.addEventListener("click",go);
h.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}});
})();
function cmpBtn(id){const on=S.cmp.includes(id);return `<button class="chip cmpb" data-cmp="${id}" aria-pressed="${on}">${on?"Dipilih":"Bandingkan"}</button>`}
function updTray(){
  $("#tray").classList.toggle("show",S.cmp.length>0);
  $("#tslots").innerHTML=[0,1,2].map(i=>{const id=S.cmp[i];return id===undefined?`<span class="slot empty">+</span>`:`<span class="slot"><b>${P[id].n}</b><button class="rm" data-cmprm="${id}" aria-label="Hapus ${P[id].n}">✕</button></span>`}).join("");
  $("#tgo").disabled=S.cmp.length<2;$("#tgo").textContent=S.cmp.length<2?"Pilih min. 2":"Bandingkan "+S.cmp.length+" hp";
  document.querySelectorAll("[data-cmp]").forEach(b=>{const on=S.cmp.includes(+b.dataset.cmp);b.setAttribute("aria-pressed",on);b.textContent=on?"Dipilih":"Bandingkan"});
}
function togCmp(id){
  const k=S.cmp.indexOf(id);
  if(k>=0){S.cmp.splice(k,1)}
  else if(S.cmp.length>=3){const t=$("#tray");t.classList.remove("shake");void t.offsetWidth;t.classList.add("shake");toast("Maksimal 3 hp untuk dibandingkan");return}
  else{S.cmp.push(id);toast(P[id].n+" ditambahkan")}
  updTray();
}
function bestOf(L,key,mode){const v=L.map(p=>p[key]),b=mode==="min"?Math.min(...v):Math.max(...v);return v.every(x=>x===b)?[]:v.map(x=>x===b)}
function openCmp(){
  const L=S.cmp.map(i=>P[i]),n=L.length;if(n<2)return;
  const R=[["Harga",p=>rp(p.p),"p","min"],["Layar",p=>p.s],["Chipset",p=>p.ch],["RAM",p=>p.r+" GB","r","max"],["Penyimpanan",p=>p.m+" GB","m","max"],["Kamera",p=>p.k],["Baterai",p=>p.bt+" mAh","bt","max"],["Sistem operasi",p=>p.o],["Kategori",p=>p.c]];
  let i=0,h=`<div class="cl" style="--i:${i++}"></div>`+L.map(p=>`<div class="ch" style="--i:${i++}"><span class="tag">${p.b}</span><div class="cpic">${img(p)}</div><b>${p.n}</b></div>`).join("");
  R.forEach(([lab,f,key,mode])=>{const b=key?bestOf(L,key,mode):[];h+=`<div class="cl" style="--i:${i++}">${lab}</div>`+L.map((p,j)=>`<div class="cv ${b[j]?"best":""}" style="--i:${i++}">${f(p)}</div>`).join("")});
  $("#mod").className="t modal wide";
  $("#mod").innerHTML=`<button class="x" data-close aria-label="Tutup">✕</button><h2 id="mt">Bandingkan hp</h2><p class="sub">${L.map(p=>p.n).join(" vs ")}</p><div class="cmpg" style="grid-template-columns:110px repeat(${n},minmax(150px,1fr))">${h}</div><p class="cleg">Kotak hitam menandai nilai terbaik: harga terendah serta RAM, penyimpanan, dan baterai terbesar.</p>`;
  $("#ov").classList.add("open");setTimeout(()=>$("#mod .x").focus(),50);
}
render();
</script>
</body>
</html>
